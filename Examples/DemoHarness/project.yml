name: AnalyticsDropDemo
options:
  bundleIdPrefix: dev.analyticsdrop
  deploymentTarget:
    iOS: "16.0"
packages:
  AnalyticsDrop:
    path: ../..
targets:
  AnalyticsDropDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.analyticsdrop.demo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: AnalyticsDrop
        product: AnalyticsDrop
